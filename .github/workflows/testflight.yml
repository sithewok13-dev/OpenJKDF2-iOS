# Sends the IPAs from a release to TestFlight, signed for the owner's App Store
# account (the shared Sithewok-apps/ios-pipeline workflow does the work). Runs
# only when started by hand; nothing here rebuilds the game or touches the
# public releases, ios-latest, or the AltStore / SideStore source.
#
# The TestFlight apps have their own bundle IDs (com.sithewok.openjkdf2 and
# com.sithewok.openmots), so they install next to sideloaded copies, each with
# its own Files folder. Needs the eight repository secrets listed in the
# pipeline's README. No game data is in the IPAs.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to send (ios-latest = newest build, or a tag such as v0.9-beta1)
        required: true
        default: ios-latest

jobs:
  jedi-knight:
    uses: Sithewok-apps/ios-pipeline/.github/workflows/testflight-ipa.yml@main
    with:
      app_identifier: com.sithewok.openjkdf2
      app_name: OpenJKDF2
      release_tag: ${{ inputs.release_tag }}
      ipa_asset: OpenJKDF2-iOS-unsigned.ipa
      icon: packaging/icon.png
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      CERTS_REPO_URL: ${{ secrets.CERTS_REPO_URL }}
      CERTS_REPO_USER: ${{ secrets.CERTS_REPO_USER }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

  # After Jedi Knight, so the first run creates the signing certificate once.
  # Runs even if Jedi Knight failed.
  mots:
    needs: jedi-knight
    if: ${{ !cancelled() }}
    uses: Sithewok-apps/ios-pipeline/.github/workflows/testflight-ipa.yml@main
    with:
      app_identifier: com.sithewok.openmots
      app_name: OpenMoTS
      release_tag: ${{ inputs.release_tag }}
      ipa_asset: OpenJKDF2-MotS-iOS-unsigned.ipa
      # Only a 256 px MotS icon exists; it is scaled up to 1024 px.
      icon: packaging/mots_icon-256.png
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      CERTS_REPO_URL: ${{ secrets.CERTS_REPO_URL }}
      CERTS_REPO_USER: ${{ secrets.CERTS_REPO_USER }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
